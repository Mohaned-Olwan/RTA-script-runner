name: Build RTA Script Runner (.exe)
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Bundle the browser inside the app (Chromium — company Edge policies don't apply to it)
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium
      - name: Smoke test on Windows (RTA window + dashboard bridge, bundled browser)
        run: python ci_smoke.py
      - run: python -m PyInstaller --noconfirm --onedir --windowed --name RTA_Script_Runner --collect-all customtkinter --hidden-import teams_sender --hidden-import reports --hidden-import web_host --hidden-import web_tab --hidden-import sched_util --hidden-import app_main --hidden-import browser_util --collect-all uiautomation --hidden-import comtypes.stream --collect-data tzdata --add-data "web;web" --hidden-import PIL.BmpImagePlugin --collect-all playwright rta_runner.py
      - name: Check the browser is inside the package
        run: |
          $c = Get-ChildItem -Recurse dist\RTA_Script_Runner -Filter chrome.exe | Select-Object -First 1
          if (-not $c) { throw "bundled chrome.exe missing" }
          Write-Host "bundled browser:" $c.FullName
      - uses: actions/upload-artifact@v4
        with: { name: RTA_Script_Runner, path: dist/RTA_Script_Runner }
