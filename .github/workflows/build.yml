name: Build RTA Script Runner (.exe)
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name RTA_Script_Runner --collect-all customtkinter --hidden-import teams_sender --hidden-import PIL.BmpImagePlugin rta_runner.py
      - uses: actions/upload-artifact@v4
        with: { name: RTA_Script_Runner, path: dist/RTA_Script_Runner.exe }
